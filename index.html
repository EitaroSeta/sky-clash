<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101323">
  <title>SKY CLASH — スカイクラッシュ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="redesign.css">
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<main id="app">
  <header class="topbar"><a class="brand" href="./" aria-label="SKY CLASH ホーム"> SKY<span>CLASH</span></a><div class="top-actions"><button id="sound" class="icon-btn" aria-label="サウンドをオフにする">音 ON</button><details class="audio-settings"><summary aria-label="音量設定">♫</summary><div class="audio-panel"><strong>音量</strong><label>BGM <input id="music-volume" type="range" min="0" max="100" value="45" aria-label="BGM音量"></label><label>SE <input id="sfx-volume" type="range" min="0" max="100" value="75" aria-label="効果音音量"></label><small>バトル開始で音楽が流れます</small></div></details><button id="pause" class="icon-btn" aria-label="一時停止">Ⅱ</button></div></header>
  <section class="arena-shell">
    <canvas id="game" aria-label="対戦アクションゲーム。操作説明は画面下にあります。"></canvas>
    <div class="arena-label"></div>
    <div id="hud" class="hud hidden"><div class="fighter-card player-card"><div class="avatar"><img id="p-avatar" src="kai-portrait.svg" alt="カイの肖像"></div><div><span class="fighter-name"><span id="p-name">カイ</span> <em>1P</em></span><div class="damage"><span id="p-damage">0</span><small>%</small></div><div id="p-stock" class="stocks"></div></div></div><div class="match-info"><span>港通り</span><strong id="timer">3:00</strong><small id="round-note">3ストック</small></div><div class="fighter-card cpu-card"><div><span class="fighter-name"><em>CPU</em> <span id="c-name">レオ</span></span><div class="damage"><span id="c-damage">0</span><small>%</small></div><div id="c-stock" class="stocks"></div></div><div class="avatar nova"><img id="c-avatar" src="nova-portrait.svg" alt="ノヴァの肖像"></div></div></div>
    <div id="menu" class="overlay"><div class="menu-content"><div class="eyebrow"><span></span> </div><h1>SELECT <span>FIGHTER</span></h1><div class="arcade-select"><div hidden><select id="character"><option value="boxing">レオ｜ボクシング</option><option value="karate" selected>カイ｜空手</option><option value="taekwondo">ユン｜テコンドー</option><option value="martial">リン｜マーシャルアーツ</option><option value="judo">ゴウ｜柔道</option></select><select id="cpu-character"><option value="boxing">レオ｜ボクシング</option><option value="karate">カイ｜空手</option><option value="taekwondo">ユン｜テコンドー</option><option value="martial">リン｜マーシャルアーツ</option><option value="judo">ゴウ｜柔道</option></select><span id="hero-name"></span><span id="character-detail"></span></div>
<div class="versus-line"><button id="seat-p" class="seat player-seat" aria-pressed="true" aria-label="自分のキャラクターを選ぶ"><span class="seat-tag">1P</span><canvas id="preview-p" role="img" aria-label="ファイティングポーズ"></canvas><span class="seat-caption"><strong id="preview-p-name">カイ</strong><small id="preview-p-art">空手</small></span></button><strong class="versus">VS</strong><button id="seat-c" class="seat cpu-seat" aria-pressed="false" aria-label="CPUのキャラクターを選ぶ"><span class="seat-tag">CPU</span><canvas id="preview-c" role="img" aria-label="ファイティングポーズ"></canvas><span class="seat-caption"><strong id="preview-c-name">レオ</strong><small id="preview-c-art">ボクシング</small></span></button></div>
<p id="selection-prompt" class="selection-prompt" aria-live="polite">1P のキャラクターを選択</p><div class="fighter-grid" aria-label="キャラクター一覧"><button id="pick-boxing" class="pick-card" aria-label="レオ、ボクシング" aria-pressed="false"><img src="fighter-boxing.svg?v=pose2" alt=""><strong>レオ</strong><small>ボクシング</small><span class="pick-badges"><b class="badge-p">1P</b><b class="badge-c">CPU</b></span></button><button id="pick-karate" class="pick-card" aria-label="カイ、空手" aria-pressed="false"><img src="fighter-karate.svg?v=pose2" alt=""><strong>カイ</strong><small>空手</small><span class="pick-badges"><b class="badge-p">1P</b><b class="badge-c">CPU</b></span></button><button id="pick-taekwondo" class="pick-card" aria-label="ユン、テコンドー" aria-pressed="false"><img src="fighter-taekwondo.svg?v=pose2" alt=""><strong>ユン</strong><small>テコンドー</small><span class="pick-badges"><b class="badge-p">1P</b><b class="badge-c">CPU</b></span></button><button id="pick-martial" class="pick-card" aria-label="リン、マーシャルアーツ" aria-pressed="false"><img src="fighter-martial.svg?v=pose2" alt=""><strong>リン</strong><small>マーシャルアーツ</small><span class="pick-badges"><b class="badge-p">1P</b><b class="badge-c">CPU</b></span></button><button id="pick-judo" class="pick-card" aria-label="ゴウ、柔道" aria-pressed="false"><img src="fighter-judo.svg?v=pose2" alt=""><strong>ゴウ</strong><small>柔道</small><span class="pick-badges"><b class="badge-p">1P</b><b class="badge-c">CPU</b></span></button></div><div class="move-strip"><strong id="move-style"></strong><span id="move-normal"></span><span id="move-strong"></span></div></div><div class="setup"><div><label for="difficulty">相手の強さ</label><select id="difficulty"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">つよい</option></select></div><div class="rule-chip"><span>対戦ルール</span><strong>3ストック <b>·</b> 3分</strong></div></div><button id="start" class="primary">対戦開始 <span>→</span></button><button id="tutorial-start" class="secondary tutorial-entry">操作を練習する</button><div class="menu-hint">1P vs CPU</div></div></div>
    <div id="pause-screen" class="overlay centered hidden"><div class="modal"><div class="eyebrow"></div><h2>ひと休み</h2><button id="resume" class="primary">再開 <span>▶</span></button><button id="back-menu" class="secondary">タイトル</button></div></div>
    <div id="result" class="overlay centered hidden"><div class="modal"><div id="result-label" class="eyebrow">MATCH COMPLETE</div><h2 id="result-title">YOU WIN</h2><p id="result-copy"></p><div class="result-stats"><div><small>与えたダメージ</small><strong id="stat-damage">0%</strong></div><div><small>撃墜数</small><strong id="stat-ko">0</strong></div></div><button id="rematch" class="primary">再戦 <span>→</span></button><button id="result-menu" class="secondary">タイトル</button></div></div>
    <section id="tutorial-panel" class="tutorial-panel hidden" aria-label="操作練習"><div><strong id="lesson-title"></strong><p id="lesson-copy"></p><span id="lesson-feedback" role="status"></span></div><button id="tutorial-exit" aria-label="練習を終了してタイトルへ">終了</button></section>
    <div id="tutorial-done" class="overlay centered hidden"><div class="modal"><h2>練習クリア！</h2><p>次は対戦してみよう。</p><button id="tutorial-battle" class="primary">対戦する</button><button id="tutorial-retry" class="secondary">もう一度練習</button><button id="tutorial-home" class="secondary">タイトル</button></div></div>
    <div id="announcement" aria-live="polite"></div>
    <div id="touch-controls" class="touch-controls hidden"><div id="move-zone" aria-label="左側をスライドして移動"><span class="move-hint">← 移動 →</span><div id="stick" class="hidden"><div id="stick-knob"></div></div></div><div class="simple-actions"><button id="simple-attack" aria-label="攻撃。長押しで強攻撃">攻撃<small>長押しで強攻撃</small></button><button data-key="jump" class="simple-jump" aria-label="ジャンプ">↑<small>ジャンプ</small></button></div></div>
  </section>
  <footer><details class="controls-help"><summary>操作方法</summary><div class="instructions"><span><kbd>A</kbd><kbd>D</kbd> 移動</span><span><kbd>Space</kbd> ジャンプ</span><span><kbd>J</kbd> 攻撃・長押しで強攻撃</span><span><kbd>Esc</kbd> 中断</span></div><div class="tip">スマホ：左側をスライドして移動。右側でジャンプと攻撃。ジャンプは空中でもう1回。</div></details></footer>
</main>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
